[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-practical-loader"
version = "1.0.0"
description = "IPython magic to create code-only notebooks from ML Practical Cloud"
requires-python = ">=3.9"
dependencies = ["requests>=2.31"]

[tool.setuptools]
py-modules = ["mlpractical"]
